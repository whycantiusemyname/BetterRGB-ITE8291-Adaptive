name: Build Windows x64

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      LLVM_MINGW_VERSION: "20260616"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache LLVM-MinGW
        id: cache-llvm-mingw
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\llvm-mingw
          key: llvm-mingw-${{ env.LLVM_MINGW_VERSION }}-ucrt-x86_64

      - name: Install LLVM-MinGW
        if: steps.cache-llvm-mingw.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = $env:LLVM_MINGW_VERSION
          $archive = "llvm-mingw-$version-ucrt-x86_64.zip"
          $url = "https://github.com/mstorsjo/llvm-mingw/releases/download/$version/$archive"
          $zip = Join-Path $env:RUNNER_TEMP $archive
          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile $zip
          $extract = Join-Path $env:RUNNER_TEMP "llvm-mingw"
          New-Item -ItemType Directory -Path $extract -Force | Out-Null
          Expand-Archive -LiteralPath $zip -DestinationPath $extract -Force

      - name: Resolve toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $bin = Join-Path $env:RUNNER_TEMP "llvm-mingw\llvm-mingw-$env:LLVM_MINGW_VERSION-ucrt-x86_64\bin"
          if (-not (Test-Path -LiteralPath $bin)) { throw "toolchain bin not found: $bin" }
          "LLVM_MINGW_BIN=$bin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & (Join-Path $bin "clang.exe") --version

      - name: Build
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File .\build\build.ps1

      - name: Verify binary
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File .\build\verify_binary.ps1 -Executable ".\out\Better RGB Adaptive v3.4.5.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BetterRGB-Adaptive-v3.4.5-x64
          path: out/Better RGB Adaptive v3.4.5.exe
          if-no-files-found: error
